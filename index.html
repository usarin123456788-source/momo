<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <title>超難関！ももいろクローバーZ クイズ</title>
  <style>
    /* 全体基本スタイル */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }


    body {
      background-color: #121214;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }


    /* ゲームコンテナ */
    .game-container {
      width: 100%;
      max-width: 800px;
      background-color: #1e1e24;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
    }


    /* ビジュアルエリア（16:9比率保持） */
    .visual-area {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      overflow: hidden;
    }


    .visual-area img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }


    /* タイトルオーバーレイテキスト */
    .title-overlay {
      position: absolute;
      top: 15%;
      width: 100%;
      text-align: center;
      font-size: 3rem;
      font-weight: 900;
      color: #ff3366;
      text-shadow: 0 0 10px #ffffff, 0 0 20px #ff3366, 0 0 30px #ff3366;
      letter-spacing: 4px;
      animation: pulse 2s infinite alternate;
    }


    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }


    /* メインコンテンツエリア */
    .content-area {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }


    /* タイマー＆ステータスバー */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1.1rem;
    }


    .timer-container {
      flex-grow: 1;
      margin-left: 20px;
      background-color: #333;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }


    .timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff0055, #ffcc00);
      transition: width 0.1s linear;
    }


    /* 問題文エリア */
    .question-text {
      font-size: 1.15rem;
      line-height: 1.6;
      background-color: #2a2a32;
      padding: 15px;
      border-radius: 8px;
      border-left: 5px solid #ff3366;
      min-height: 80px;
    }


    /* 選択肢ボタンエリア */
    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }


    @media (max-width: 600px) {
      .answers-grid {
        grid-template-columns: 1fr;
      }
      .title-overlay {
        font-size: 2rem;
      }
    }


    .btn {
      background-color: #32323e;
      color: #fff;
      border: 2px solid #444454;
      padding: 12px 15px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }


    .btn:hover:not(:disabled) {
      background-color: #ff3366;
      border-color: #ff3366;
      transform: translateY(-2px);
    }


    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }


    /* 解説エリア */
    .explanation-area {
      background-color: #252530;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }


    .result-header {
      font-size: 1.3rem;
      font-weight: bold;
    }


    .result-header.correct { color: #4caf50; }
    .result-header.incorrect { color: #f44336; }


    /* 操作アクションエリア */
    .action-area {
      display: flex;
      justify-content: flex-end;
    }


    .action-btn {
      background-color: #ff3366;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
      transition: all 0.2s ease;
    }


    .action-btn:hover {
      background-color: #ff527b;
      transform: scale(1.05);
    }


    /* 非表示クラス */
    .hidden {
      display: none !important;
    }
  </style>
</head>

  // =========================================================
  // ゲームの状態管理
  // =========================================================
  let currentQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let timer = null;
  let timeLeft = 15;


  // DOM要素
  const charImg = document.getElementById('char-img');
  const titleText = document.getElementById('title-text');
  
  const screenTitle = document.getElementById('screen-title');
  const screenQuiz = document.getElementById('screen-quiz');
  const screenExplanation = document.getElementById('screen-explanation');
  const screenResult = document.getElementById('screen-result');


  const quizProgress = document.getElementById('quiz-progress');
  const timerText = document.getElementById('timer-text');
  const timerBar = document.getElementById('timer-bar');
  const questionText = document.getElementById('question-text');
  const answersGrid = document.getElementById('answers-grid');


  const resultHeader = document.getElementById('result-header');
  const explanationText = document.getElementById('explanation-text');
  
  const resultScore = document.getElementById('result-score');
  const resultComment = document.getElementById('result-comment');


  // =========================================================
  // ゲーム制御ロジック
  // =========================================================


  // ゲームスタート
  function startGame() {
    const shuffled = [...quizDatabase].sort(() => 0.5 - Math.random());
    currentQuestions = shuffled.slice(0, 5);


    currentIndex = 0;
    score = 0;


    titleText.classList.add('hidden');
    screenTitle.classList.add('hidden');
    screenResult.classList.add('hidden');
    screenExplanation.classList.add('hidden');
    screenQuiz.classList.remove('hidden');


    showQuestion();
  }


  // 問題表示
  function showQuestion() {
    clearInterval(timer);
    const q = currentQuestions[currentIndex];


    charImg.src = 'char_normal.jpg';


    quizProgress.textContent = `第 ${currentIndex + 1} / 5 問`;
    questionText.textContent = q.q;


    answersGrid.innerHTML = '';
    q.a.forEach((ans, idx) => {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.textContent = `${idx + 1}. ${ans}`;
      btn.onclick = () => selectAnswer(idx);
      answersGrid.appendChild(btn);
    });


    timeLeft = 15;
    timerText.textContent = timeLeft;
    timerBar.style.width = '100%';


    const startTime = Date.now();
    const duration = 15000;


    timer = setInterval(() => {
      const elapsedTime = Date.now() - startTime;
      const remainingTime = Math.max(0, duration - elapsedTime);
      
      timeLeft = Math.ceil(remainingTime / 1000);
      timerText.textContent = timeLeft;
      timerBar.style.width = `${(remainingTime / duration) * 100}%`;


      if (remainingTime <= 0) {
        clearInterval(timer);
        handleTimeout();
      }
    }, 100);
  }


  // 解答選択
  function selectAnswer(selectedIndex) {
    clearInterval(timer);
    const q = currentQuestions[currentIndex];
    const isCorrect = (selectedIndex === q.correct);


    if (isCorrect) {
      score++;
      showExplanation(true, "正解！", q.exp);
    } else {
      showExplanation(false, `不正解…（正解: ${q.correct + 1}. ${q.a[q.correct]}）`, q.exp);
    }
  }


  // 時間切れ処理
  function handleTimeout() {
    const q = currentQuestions[currentIndex];
    showExplanation(false, `時間切れ…（正解: ${q.correct + 1}. ${q.a[q.correct]}）`, q.exp);
  }


  // 解説画面の表示
  function showExplanation(isCorrect, title, expText) {
    const btns = answersGrid.querySelectorAll('.btn');
    btns.forEach(b => b.disabled = true);


    if (isCorrect) {
      charImg.src = 'char_correct_normal.jpg';
      resultHeader.textContent = title;
      resultHeader.className = 'result-header correct';
    } else {
      charImg.src = 'char_incorrect.jpg';
      resultHeader.textContent = title;
      resultHeader.className = 'result-header incorrect';
    }


    explanationText.textContent = expText;
    screenExplanation.classList.remove('hidden');
  }


  // 次の問題へ進む
  function nextQuestion() {
    screenExplanation.classList.add('hidden');
    currentIndex++;


    if (currentIndex < 5) {
      showQuestion();
    } else {
      showResult();
    }
  }


  // リザルト画面
  function showResult() {
    screenQuiz.classList.add('hidden');
    screenExplanation.classList.add('hidden');
    screenResult.classList.remove('hidden');


    // スコアに応じたキャラクター画像の切り替え
    if (score === 5) {
      charImg.src = 'char_correct_all.jpg'; // 全問正解
    } else if (score === 1) {
      charImg.src = 'char_incorrect_4.jpg';  // 4問不正解（1問正解）
    } else if (score === 0) {
      charImg.src = 'char_incorrect_all.jpg'; // 全問不正解
    } else {
      charImg.src = 'char_normal.jpg';       // その他（2〜4問正解）
    }


    resultScore.textContent = `5問中 ${score}問 正解！`;
    
    if (score === 5) {
      resultComment.textContent = "素晴らしい！あなたは完璧なモノノフです！";
    } else if (score >= 3) {
      resultComment.textContent = "お見事！なかなかのモノノフ度ですね！";
    } else if (score >= 1) {
      resultComment.textContent = "惜しい！もう少しでももクロに詳しくなれるはず！";
    } else {
      resultComment.textContent = "全問不正解…！愛の力でもう一度挑戦だ！";
    }
  }


  // タイトルに戻る
  function resetToTitle() {
    screenResult.classList.add('hidden');
    screenTitle.classList.remove('hidden');
    titleText.classList.remove('hidden');
    charImg.src = 'char_title.jpg';
  }
